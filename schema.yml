openapi: 3.0.3
info:
  title: ProfiSfera PIM — Catalog API
  version: 1.0.0
  description: 'Headless-каталог ProfiSfera: товары, категории, характеристики, бренды,
    документы, навигационные фасеты, группировки вариантов и обучение. Публичное чтение;
    запись — по токену staff. Ключ интеграции контента — внутренний sku. Инкрементальная
    выборка — параметр updated_since. Коммерческий слой (цены/остатки/клиенты) в контракт
    не входит.'
