  /api/products/:
    get:
      operationId: api_products_list
      description: Публичный список карточек. Фильтры комбинируются по И. Внутри мультизначных
        фасетов (audience/direction) значения работают по ИЛИ.
      summary: Список товаров
      parameters:
      - in: query
        name: audience
        schema:
          type: string
        description: Slug(и) аудитории через запятую.
      - in: query
        name: brand
        schema:
          type: integer
        description: ID бренда.
      - in: query
        name: category
        schema:
          type: integer
        description: ID категории (включая всех потомков).
      - in: query
        name: direction
        schema:
          type: string
        description: Slug(и) направления через запятую.
      - in: query
        name: external_id
        schema:
          type: string
        description: Код ERP продавца (коммерческий слой; для контента используйте
          sku).
      - in: query
        name: external_id__in
        schema:
          type: string
        description: Несколько кодов ERP через запятую.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: name | created_at | updated_at (с «-» — по убыванию).'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию/артикулу производителя/краткому описанию.
      - in: query
        name: sku
        schema:
          type: string
        description: Точный внутренний sku PIM (ключ интеграции контента).
      - in: query
        name: sku__in
        schema:
          type: string
        description: Несколько sku через запятую.
      - in: query
        name: updated_since
        schema:
          type: string
        description: ISO-8601 дата-время (URL-кодировать). Только изменённые после
          момента — для инкрементальной синхронизации.
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
    post:
      operationId: api_products_create
      tags:
      - api
