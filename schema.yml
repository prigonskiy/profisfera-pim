components:
  schemas:
    Audience:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 255
        slug:
          type: string
          description: Оставьте пустым — сгенерируется автоматически из названия (транслитерацией).
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        icon:
          type: string
          title: Иконка
          description: Идентификатор иконки для меню магазина (опционально).
          maxLength: 64
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Порядок
      required:
      - id
      - name
    AudienceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Название
          maxLength: 255
        slug:
          type: string
          description: Оставьте пустым — сгенерируется автоматически из названия (транслитерацией).
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        icon:
