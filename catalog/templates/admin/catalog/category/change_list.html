{% extends "admin/change_list.html" %}
{% block object-tools-items %}
  <li>
    <form method="post" action="rebuild/" style="display:inline;margin:0">
      {% csrf_token %}
      <button type="submit"
              title="Отправить в GitHub событие пересборки витрины"
              style="cursor:pointer;border:0;border-radius:4px;padding:5px 10px;
                     background:#79aec8;color:#fff;font-size:11px;font-weight:600;
                     text-transform:uppercase;letter-spacing:.5px;line-height:16px;
                     vertical-align:middle">Пересобрать витрину</button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
