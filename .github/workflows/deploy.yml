name: CI & Deploy

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Тесты и проверки
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pim
          POSTGRES_USER: pim
          POSTGRES_PASSWORD: pim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pim"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-not-a-real-secret
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      DB_ENGINE: postgres
      DB_NAME: pim
      DB_USER: pim
      DB_PASSWORD: pim
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # как на VPS (Ubuntu 24.04)

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt

      - name: Системная проверка Django
        run: python manage.py check

      - name: Миграции не отстают от моделей
        run: python manage.py makemigrations --check --dry-run

      - name: Тесты
        run: python manage.py test

  deploy:
    name: Деплой на VPS
    needs: test            # деплой только если job "test" прошёл
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /srv/pim
            bash deploy.sh
