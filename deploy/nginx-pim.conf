# Конфиг nginx. Копируется в /etc/nginx/sites-available/pim
server {
    listen 80;
    server_name _;            # принимает запросы по IP; позже впишем домен

    client_max_body_size 25M; # запас на загрузку PDF и изображений

    location /static/ {
        alias /srv/pim/staticfiles/;
    }

    location /media/ {
        alias /srv/pim/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
